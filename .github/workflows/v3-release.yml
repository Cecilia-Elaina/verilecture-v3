name: VeriLecture V3 Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle: nsis
          - platform: linux
            os: ubuntu-24.04
            bundle: appimage
          - platform: macos
            os: macos-latest
            bundle: dmg
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native app icons
        if: matrix.platform != 'windows'
        run: pnpm exec tauri icon src-tauri/icons/icon.png

      - name: Fetch and verify Windows FFmpeg resource
        if: matrix.platform == 'windows'
        shell: pwsh
        run: .\scripts\fetch_ffmpeg.ps1

      - name: Build native installer
        run: pnpm exec tauri build --ci --bundles ${{ matrix.bundle }}

      - name: Collect Windows installer and checksum
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $bundle) { throw 'The Tauri NSIS installer was not produced.' }
          New-Item -ItemType Directory -Force -Path 'release-assets' | Out-Null
          Copy-Item -LiteralPath $bundle.FullName -Destination 'release-assets'
          $hash = (Get-FileHash -LiteralPath $bundle.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($bundle.Name)" | Set-Content -LiteralPath "release-assets\SHA256SUMS-windows-${{ github.ref_name }}.txt" -Encoding utf8

      - name: Collect Linux or macOS installer and checksum
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="src-tauri/target/release/bundle/${{ matrix.bundle }}"
          bundle="$(find "$bundle_dir" -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.dmg' \) -print -quit)"
          test -n "$bundle"
          mkdir -p release-assets
          cp "$bundle" release-assets/
          shasum -a 256 "release-assets/$(basename "$bundle")" > "release-assets/SHA256SUMS-${{ matrix.platform }}-${{ github.ref_name }}.txt"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: verilecture-v3-${{ matrix.platform }}-${{ github.ref_name }}
          path: frontend/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub pre-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/*
