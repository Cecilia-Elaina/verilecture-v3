name: VeriLecture V3 Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and verify FFmpeg resource
        shell: pwsh
        run: .\scripts\fetch_ffmpeg.ps1

      - name: Build Windows NSIS installer
        run: pnpm tauri:build

      - name: Generate installer checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'src-tauri\target\release\bundle\nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer) { throw 'The Tauri NSIS installer was not produced.' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath '..\SHA256SUMS-v0.3.0-alpha.1.txt' -Encoding utf8

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: verilecture-v3-windows-installer
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-v0.3.0-alpha.1.txt

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body_path: docs/releases/v0.3.0-alpha.1.md
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS-v0.3.0-alpha.1.txt
