name: VeriLecture V3 CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect change scope
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.scope.outputs.app }}
      site: ${{ steps.scope.outputs.site }}
      writing: ${{ steps.scope.outputs.writing }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$BASE_SHA"
            head="$HEAD_SHA"
          else
            base="$BEFORE_SHA"
            head="$HEAD_SHA"
          fi

          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$base" "$head")"
          else
            files="$(git ls-tree -r --name-only "$head")"
          fi

          app=false
          site=false
          writing=false
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              site/*)
                site=true
                writing=true
                ;;
              .github/workflows/pages.yml)
                site=true
                ;;
              docs/*|*.md|frontend/src/*|writing/*|styles/*|.vale.ini)
                writing=true
                ;;
              *)
                app=true
                ;;
            esac
          done <<< "$files"

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "site=$site" >> "$GITHUB_OUTPUT"
          echo "writing=$writing" >> "$GITHUB_OUTPUT"

  writing:
    name: Verify writing quality
    needs: changes
    if: needs.changes.outputs.writing == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run Vale on product text
        uses: vale-cli/vale-action@v3
        with:
          version: 3.19.0
          files: '["README.md", "README.en.md", "docs", "site", "frontend/src"]'
          sync: false
          fail_level: warning

  site:
    name: Verify product site
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check site JavaScript
        run: node --check site/script.js

  verify:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    name: Verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test

      - name: Frontend production build
        run: pnpm build

      - name: Rust formatting check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Verify Tauri compilation without bundling
        if: matrix.platform == 'windows'
        run: pnpm exec tauri build --no-bundle --ci

      - name: Verify Tauri compilation without bundling (Linux or macOS config)
        if: matrix.platform != 'windows'
        run: pnpm exec tauri build --no-bundle --ci --config src-tauri/tauri.${{ matrix.platform }}.conf.json
