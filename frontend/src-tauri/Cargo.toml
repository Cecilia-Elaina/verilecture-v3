[package]
name = "verilecture-v3"
version = "0.3.0-alpha.1"
description = "VeriLecture / 课溯 local-first audio study tool"
authors = ["Cecilia-Elaina"]
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Cecilia-Elaina/verilecture-v3"
build = "build.rs"

[lib]
name = "verilecture_v3_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.0", features = [] }

[dependencies]
tauri = { version = "2.6.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.12", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.34"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = { version = "3.6", features = ["windows-native"] }
base64 = "0.22"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
pdf-extract = "0.8"
tokio = { version = "1.43", features = ["process", "io-util", "time"] }
futures-util = "0.3"
urlencoding = "2.1"

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
